<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Legal Doc Parser – Upload</title>
  </head>
  <body>
    <h1>Upload a legal PDF</h1>
    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="pdf" accept="application/pdf" required>
      <button type="submit">Upload & Parse</button>
    </form>
  </body>
</html>
